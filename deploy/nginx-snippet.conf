# mydrone.uz server bloki ichiga qo'shiladigan qismlar
# (setup-server.sh buni avtomatik qo'shadi; qo'lda kerak bo'lsa — shu yerdan oling)

    # Siqish (faqat shu sayt uchun)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml font/ttf font/otf;

    # SPA fallback — haqiqiy manzillar uchun SHART
    # (/katalog, /mahsulot/dji-mini-4-pro va h.k. index.html ga yo'naltiriladi)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin panel: nginx darajasida parol
    location = /admin.html {
        auth_basic "MyDrone admin";
        auth_basic_user_file /etc/nginx/.htpasswd-mydrone;
        try_files $uri =404;
    }

    # Statik fayllar keshi
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
